<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Reading Buddy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      color: #fff;
    }

    /* ── SCREENS ── */
    .screen { display: none; width: 100%; max-width: 480px; padding: 24px 24px 48px; text-align: center; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 20px; }

    /* ── NAME SCREEN ── */
    #nameScreen h1 { font-size: 2.4rem; color: #ffd700; text-shadow: 0 0 20px #ffd70080; }
    #nameScreen p  { font-size: 1.1rem; color: #aad4f5; }
    #nameInput {
      font-family: inherit; font-size: 1.5rem;
      padding: 14px 20px; border-radius: 16px;
      border: 3px solid #ffd700; background: rgba(255,255,255,0.1);
      color: #fff; width: 100%; text-align: center; outline: none;
    }
    #nameInput::placeholder { color: rgba(255,255,255,0.4); }
    .btn-big {
      font-family: inherit; font-size: 1.4rem; font-weight: bold;
      padding: 16px 40px; border-radius: 50px; border: none;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .btn-big:active { transform: scale(0.95); }
    .btn-start { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }
    .btn-start:hover { transform: scale(1.05); box-shadow: 0 8px 28px rgba(255,215,0,0.5); }

    .btn-row { display: flex; gap: 12px; width: 100%; }
    .btn-row .btn-big { flex: 1; font-size: 1.1rem; }

    /* ── GAME SCREEN ── */
    #gameScreen { gap: 16px; }

    .top-bar {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; font-size: 0.85rem; color: #aad4f5;
    }
    .xp-badge {
      background: rgba(255,215,0,0.2); border: 1px solid #ffd700;
      border-radius: 20px; padding: 4px 14px; font-weight: bold; color: #ffd700;
    }
    .dragon-counter {
      background: rgba(255,100,50,0.2); border: 1px solid #ff6432;
      border-radius: 20px; padding: 4px 14px; color: #ff9970;
    }

    /* word display */
    .word-area {
      width: 100%; background: rgba(255,255,255,0.07);
      border-radius: 24px; padding: 30px 20px;
      border: 2px solid rgba(255,255,255,0.15);
      min-height: 140px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .word-label { font-size: 0.85rem; color: #aad4f5; letter-spacing: 2px; text-transform: uppercase; }
    .blank-boxes { display: flex; gap: 10px; }
    .blank-box {
      width: 52px; height: 60px; border-radius: 12px;
      background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold; color: transparent;
      transition: all 0.3s;
    }
    .blank-box.highlight-correct { border-color: #4cff72; color: #4cff72; background: rgba(76,255,114,0.15); }
    .blank-box.highlight-wrong   { border-color: #ff4c4c; color: #ff4c4c; background: rgba(255,76,76,0.15); }
    .blank-box.revealed          { color: #fff; border-color: rgba(255,255,255,0.5); }

    .heard-text { font-size: 0.9rem; color: #aad4f5; min-height: 1.4em; font-style: italic; }

    /* mic button */
    .mic-btn {
      width: 90px; height: 90px; border-radius: 50%; border: none;
      font-size: 2.2rem; cursor: pointer;
      background: linear-gradient(135deg, #4c9fff, #1a6fff);
      box-shadow: 0 6px 24px rgba(76,159,255,0.5);
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ff4c72, #cc1a40);
      box-shadow: 0 0 0 0 rgba(255,76,114,0.7);
      animation: mic-pulse 1.2s infinite;
    }
    .mic-btn.correct-flash { background: linear-gradient(135deg, #4cff72, #1acc40); }
    .mic-btn.wrong-flash   { background: linear-gradient(135deg, #ff4c4c, #cc1a1a); }
    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,76,114,0.7); }
      70%  { box-shadow: 0 0 0 18px rgba(255,76,114,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,76,114,0); }
    }
    .mic-hint { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

    /* feedback */
    .feedback-box {
      width: 100%; min-height: 60px; background: rgba(255,255,255,0.06);
      border-radius: 16px; padding: 12px 18px; font-size: 0.95rem;
      color: #d4eeff; line-height: 1.5; border: 1px solid rgba(255,255,255,0.1);
      transition: opacity 0.3s;
    }

    /* difficulty pills */
    .diff-row { display: flex; gap: 8px; }
    .diff-pill {
      padding: 6px 16px; border-radius: 20px; border: 2px solid transparent;
      font-size: 0.8rem; font-family: inherit; cursor: pointer; font-weight: bold;
      transition: all 0.2s;
    }
    .diff-pill.easy   { background: rgba(76,255,114,0.15); color: #4cff72; border-color: #4cff72; }
    .diff-pill.medium { background: rgba(255,215,0,0.15);  color: #ffd700; border-color: #ffd700; }
    .diff-pill.hard   { background: rgba(255,76,76,0.15);  color: #ff6b6b; border-color: #ff6b6b; }
    .diff-pill.active { opacity: 1; }
    .diff-pill:not(.active) { opacity: 0.35; }

    /* ── LETTER GRID ── */
    .grid-toggle {
      width: 100%; background: none; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 10px; color: #aad4f5; font-family: inherit;
      font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
    }
    .grid-toggle:hover { background: rgba(255,255,255,0.07); }
    .letter-grid {
      display: none; grid-template-columns: repeat(6, 1fr);
      gap: 6px; width: 100%;
    }
    .letter-grid.visible { display: grid; }
    .letter-cell {
      border-radius: 8px; padding: 6px 4px; text-align: center;
      font-size: 0.75rem; font-weight: bold;
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.3);
      transition: all 0.4s;
    }
    .letter-cell .ltr { font-size: 1rem; display: block; }
    .letter-cell .pct { font-size: 0.65rem; }
    .letter-cell.great { background: rgba(76,255,114,0.2); color: #4cff72; }
    .letter-cell.good  { background: rgba(255,215,0,0.2);  color: #ffd700; }
    .letter-cell.poor  { background: rgba(255,76,76,0.2);  color: #ff6b6b; }

    /* ── PRIZE SCREEN ── */
    #prizeScreen { gap: 20px; }
    #prizeScreen h2 { font-size: 2rem; color: #ffd700; }
    .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
    .prize-item {
      background: rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 8px;
      font-size: 2rem; cursor: pointer; transition: all 0.2s;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .prize-item:hover { transform: scale(1.08); }
    .prize-item.locked { filter: grayscale(1) opacity(0.35); cursor: default; }
    .prize-item .prize-label { font-size: 0.65rem; color: #aad4f5; margin-top: 4px; }

    /* ── DRAGON SCREEN ── */
    #dragonScreen { gap: 20px; }
    #dragonCanvas { border-radius: 20px; max-width: 100%; }
    #dragonMsg { font-size: 1.2rem; color: #ffd700; text-align: center; line-height: 1.5; }
    .btn-continue { background: linear-gradient(135deg, #4cff72, #1acc40); color: #1a1a2e; }

    /* ── REPORT SCREEN ── */
    #reportScreen { gap: 18px; }
    #reportScreen h2 { font-size: 1.8rem; color: #ffd700; }
    #reportScreen .report-subtitle { font-size: 0.9rem; color: #aad4f5; }

    .report-section {
      width: 100%; background: rgba(255,255,255,0.06);
      border-radius: 16px; padding: 16px;
      border: 1px solid rgba(255,255,255,0.12); text-align: left;
    }
    .report-section h3 {
      font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      color: #aad4f5; margin-bottom: 12px;
    }
    .report-pos-group { margin-bottom: 16px; }
    .report-pos-group:last-child { margin-bottom: 0; }
    .report-pos-label {
      font-size: 0.75rem; color: rgba(255,255,255,0.45);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    }
    .report-letter-row {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .report-letter-chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08); border-radius: 20px;
      padding: 5px 12px; font-size: 0.85rem;
    }
    .report-letter-chip .chip-letter { font-weight: bold; font-size: 1rem; }
    .report-letter-chip.chip-great { border: 1px solid #4cff72; color: #4cff72; }
    .report-letter-chip.chip-good  { border: 1px solid #ffd700; color: #ffd700; }
    .report-letter-chip.chip-poor  { border: 1px solid #ff6b6b; color: #ff6b6b; }
    .report-letter-chip.chip-unseen { border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.35); }

    .report-needs-work {
      width: 100%; background: rgba(255,76,76,0.08);
      border-radius: 16px; padding: 16px;
      border: 1px solid rgba(255,100,100,0.25); text-align: left;
    }
    .report-needs-work h3 {
      font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      color: #ff9970; margin-bottom: 12px;
    }
    .report-tip-card {
      background: rgba(255,255,255,0.05); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 10px; border-left: 3px solid #ff6b6b;
    }
    .report-tip-card:last-child { margin-bottom: 0; }
    .report-tip-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .report-tip-letter {
      font-size: 1.4rem; font-weight: bold; color: #ff9970;
      background: rgba(255,100,50,0.2); border-radius: 8px;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    }
    .report-tip-meta { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
    .report-tip-meta strong { color: #ff9970; }
    .report-tip-text { font-size: 0.9rem; color: #d4eeff; line-height: 1.5; }
    .report-tip-loading { font-size: 0.85rem; color: rgba(255,255,255,0.4); font-style: italic; }

    .report-empty { font-size: 1rem; color: #aad4f5; text-align: center; padding: 20px 0; }

    .report-btn {
      background: none; border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; padding: 6px 10px; color: #aad4f5;
      font-size: 1.1rem; cursor: pointer; transition: background 0.2s;
    }
    .report-btn:hover { background: rgba(255,255,255,0.08); }

    /* ── STARS ── */
    #starField { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .screen { position: relative; z-index: 1; }

    /* responsive */
    @media (max-height: 700px) {
      .word-area { padding: 20px; min-height: 110px; }
      .mic-btn   { width: 72px; height: 72px; font-size: 1.8rem; }
      #gameScreen { gap: 10px; }
    }
  </style>
</head>
<body>

<canvas id="starField"></canvas>

<!-- ── NAME SCREEN ── -->
<div id="nameScreen" class="screen active">
  <h1>⭐ Reading Buddy ⭐</h1>
  <p>What's your name, little reader?</p>
  <input id="nameInput" type="text" placeholder="Type your name..." maxlength="20" autocomplete="off" />
  <button class="btn-big btn-start" onclick="submitName()">Let's Read! 🚀</button>
</div>

<!-- ── API KEY SCREEN ── -->
<!-- ── GAME SCREEN ── -->
<div id="gameScreen" class="screen">
  <div class="top-bar">
    <span class="xp-badge" id="xpDisplay">⭐ 0 XP</span>
    <span class="dragon-counter" id="dragonCounter">🐉 Next in 10</span>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="report-btn" title="Letter Report" onclick="showReport()">📋</button>
      <button style="background:none;border:none;color:#aad4f5;cursor:pointer;font-size:1.2rem" onclick="showPrizes()">🏆</button>
    </div>
  </div>

  <div class="diff-row">
    <button class="diff-pill easy active"   onclick="setDiff('easy')"  >Easy</button>
    <button class="diff-pill medium"        onclick="setDiff('medium')">Medium</button>
    <button class="diff-pill hard"          onclick="setDiff('hard')"  >Hard</button>
  </div>

  <div class="word-area">
    <div class="word-label" id="wordLabel">Tap the mic to start</div>
    <div class="blank-boxes" id="blankBoxes"></div>
    <div class="heard-text" id="heardText"></div>
  </div>

  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙️</button>
  <div class="mic-hint" id="micHint">Tap mic, then say the word</div>

  <div class="feedback-box" id="feedbackBox">Get started — tap the mic and read a word!</div>

  <button class="grid-toggle" onclick="toggleGrid()">📊 My Letter Progress</button>
  <div class="letter-grid" id="letterGrid"></div>
  <button id="resetBtn" class="btn-big" style="display:none;background:rgba(255,255,255,0.08);color:#ff8888;border:2px solid rgba(255,100,100,0.4);font-size:1rem;padding:12px 28px;" onclick="resetProgress()">🗑️ Reset Progress</button>
</div>

<!-- ── PRIZE SCREEN ── -->
<div id="prizeScreen" class="screen">
  <h2>🏆 My Prizes</h2>
  <div class="prize-grid" id="prizeGrid"></div>
  <button class="btn-big btn-start" onclick="showGame()">Keep Reading!</button>
</div>

<!-- ── DRAGON SCREEN ── -->
<div id="dragonScreen" class="screen">
  <canvas id="dragonCanvas" width="320" height="280"></canvas>
  <div id="dragonMsg"></div>
  <button class="btn-big btn-continue" onclick="afterDragon()">Keep Going! 🚀</button>
</div>

<!-- ── REPORT SCREEN ── -->
<div id="reportScreen" class="screen">
  <h2>📋 Letter Report</h2>
  <p class="report-subtitle" id="reportSubtitle"></p>

  <div class="report-needs-work" id="reportNeedsWork" style="display:none;">
    <h3>⚠️ Needs Practice</h3>
    <div id="reportTipsContainer"></div>
  </div>

  <div class="report-section">
    <h3>📍 By Position in Word</h3>
    <div class="report-pos-group">
      <div class="report-pos-label">Start of word</div>
      <div class="report-letter-row" id="reportPosStart"></div>
    </div>
    <div class="report-pos-group">
      <div class="report-pos-label">Middle of word (vowel)</div>
      <div class="report-letter-row" id="reportPosMid"></div>
    </div>
    <div class="report-pos-group">
      <div class="report-pos-label">End of word</div>
      <div class="report-letter-row" id="reportPosEnd"></div>
    </div>
  </div>

  <button class="btn-big btn-start" onclick="showGame()">Keep Reading!</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  HOMOPHONE MAP — longer/alternate spellings → 3-letter CVC
//  Speech recognition often picks the "grown-up" spelling of a
//  word that sounds identical to a CVC target. Since this app is
//  strictly 3-letter words, any match here counts as correct.
// ═══════════════════════════════════════════════════════════════
const HOMOPHONE_MAP = {
  // common past-tense homophones
  'lead':   'led',   // "lead" (past) = "led"
  'read':   'red',   // "read" (past) = "red"
  // silent-letter words
  'knot':   'not',
  'wrap':   'rap',
  'knap':   'nap',
  'gnat':   'nat',
  'whet':   'wet',
  'jamb':   'jam',
  // alternate/British spellings & sound-alikes
  'naught': 'not',
  'damn':   'dam',
  'son':    'sun',
  'hymn':   'him',
  'none':   'nun',
  'butt':   'but',
  'bitt':   'bit',
  'djinn':  'gin',
};

// ═══════════════════════════════════════════════════════════════
//  WORD BANK — CVC only, no repeated consecutive letters
// ═══════════════════════════════════════════════════════════════
const WORDS = {
  easy: [
    'cat','bat','hat','mat','rat','sat','pat','fat','cap','map','nap','rap','tap','sap',
    'bed','red','fed','led','web','net','pet','set','wet','get','bet','met','jet',
    'bit','sit','hit','fit','kit','lip','tip','dip','sip','zip','pin','bin','fin','tin','win',
    'hop','top','pot','dot','hot','lot','not','got','cop','pop','mop',
    'bug','cup','bun','fun','gun','run','sun','hug','jug','mug','tug','pup','rub','tub','gum','sum','hub'
  ],
  medium: [
    'cab','dab','gab','jab','lab','nab','tab','yam','jam','ham','dam','ram','yap','wax','tax','lax',
    'bad','had','lad','mad','sad','bag','rag','tag','wag','ban','can','fan','man','pan','ran','tan','van',
    'cob','fob','gob','rob','sob','log','dog','fog','hog','jog','cog','cod','nod','pod','rod','sob',
    'bud','dud','mud','pun','nun','rut','gut','hut','jut','nut','cut','but','pub','rub','sub','tub',
    'hex','vex','peg','keg','leg','beg','gem','hem','den','hen','men','pen','ten','yen',
    'fig','jig','pig','rig','wig','dim','him','rim','kin','bin','gin','sin','tin'
  ],
  hard: [
    'zap','zag','zig','zit','zen','zip','zep',
    'vat','vim','van','vex','vow',
    'yak','yam','yap','yet','yip',
    'wok','wax','web','wig','wit','won',
    'dab','dug','dun','dew','din','dig',
    'cud','cob','cog','cod','cot','cog',
    'nub','nip','nod','nun','nag',
    'pox','pod','pun','peg','pit','pug',
    'lob','lug','lid','lip','lag','lex',
    'fez','fig','fog','fob','fun','fed',
    'hob','hex','hip','hob','hog','hub',
    'jab','jig','job','jot','jug','jut'
  ]
};

// deduplicate
Object.keys(WORDS).forEach(k => { WORDS[k] = [...new Set(WORDS[k])]; });

// ═══════════════════════════════════════════════════════════════
//  PRIZES
// ═══════════════════════════════════════════════════════════════
const PRIZES = [
  { emoji: '🌟', label: 'Star Reader',      xpNeeded: 10  },
  { emoji: '🦋', label: 'Word Butterfly',   xpNeeded: 25  },
  { emoji: '🚀', label: 'Rocket Reader',    xpNeeded: 50  },
  { emoji: '🦄', label: 'Unicorn Words',    xpNeeded: 80  },
  { emoji: '🏰', label: 'Word Castle',      xpNeeded: 120 },
  { emoji: '🐉', label: 'Dragon Master',    xpNeeded: 170 },
  { emoji: '🌈', label: 'Rainbow Reader',   xpNeeded: 230 },
  { emoji: '⚡',  label: 'Lightning Words',  xpNeeded: 300 },
  { emoji: '👑', label: 'Reading Champion', xpNeeded: 400 },
];

// ═══════════════════════════════════════════════════════════════
//  STATE (localStorage key: rb4)
// ═══════════════════════════════════════════════════════════════
const SAVE_KEY = 'rb4';
let state = {
  name: '',
  xp: 0,
  correctTotal: 0,   // for dragon milestone
  sessionCount: 0,
  prizesUnlocked: [],
  letterHits: {},    // letter -> { correct, total }
  letterPos: {},     // letter+pos -> { correct, total }  e.g. 'c0', 'a1', 't2'
  apiKey: ''
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    Object.assign(state, s);
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

// ═══════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════
let currentWord = '';
let currentDiff = 'easy';
let isListening = false;
let recognition = null;
let safetyTimer = null;
let wordShown = false;
let correctSinceLastDragon = 0;   // track milestone
let abortRequested = false;        // true when stopListening called externally
const DRAGON_EVERY = 10;

// Whisper (Safari fallback)
let whisperPipeline = null;
let whisperLoading  = false;
let whisperReady    = false;
let mediaRecorder   = null;
let audioChunks     = [];

// ═══════════════════════════════════════════════════════════════
//  SCREENS
// ═══════════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showGame()   { showScreen('gameScreen'); }
function showPrizes() { renderPrizes(); showScreen('prizeScreen'); }

// ═══════════════════════════════════════════════════════════════
//  NAME SCREEN
// ═══════════════════════════════════════════════════════════════
function submitName() {
  const n = document.getElementById('nameInput').value.trim();
  if (!n) return;
  state.name = n;
  saveState();
  initGame();
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitName();
});

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
function initGame() {
  state.sessionCount++;
  saveState();
  buildLetterGrid();
  updateHUD();
  pickWord();
  showGame();
  if (isSafari) initWhisper();
}

// ═══════════════════════════════════════════════════════════════
//  WORD SELECTION
// ═══════════════════════════════════════════════════════════════
let recentWords = [];
function pickWord() {
  const pool = WORDS[currentDiff].filter(w => !recentWords.includes(w));
  const src  = pool.length > 0 ? pool : WORDS[currentDiff];
  currentWord = src[Math.floor(Math.random() * src.length)];
  recentWords.push(currentWord);
  if (recentWords.length > 6) recentWords.shift();

  wordShown = false;
  renderBlanks(false);
  document.getElementById('wordLabel').textContent = 'Tap the mic to hear a word';
  document.getElementById('heardText').textContent = '';
}

// ═══════════════════════════════════════════════════════════════
//  BLANK BOXES
// ═══════════════════════════════════════════════════════════════
function renderBlanks(revealed, heardWord) {
  const container = document.getElementById('blankBoxes');
  container.innerHTML = '';
  for (let i = 0; i < currentWord.length; i++) {
    const box = document.createElement('div');
    box.className = 'blank-box';
    if (revealed) {
      box.classList.add('revealed');
      box.textContent = currentWord[i].toUpperCase();
    } else if (heardWord) {
      // per-letter highlighting
      box.textContent = currentWord[i].toUpperCase();
      if (heardWord[i] === currentWord[i]) {
        box.classList.add('highlight-correct');
      } else {
        box.classList.add('highlight-wrong');
      }
    } else {
      box.textContent = currentWord[i].toUpperCase();
      box.style.color = 'transparent';
    }
    container.appendChild(box);
  }
}

// ═══════════════════════════════════════════════════════════════
//  DIFFICULTY
// ═══════════════════════════════════════════════════════════════
function setDiff(d) {
  currentDiff = d;
  document.querySelectorAll('.diff-pill').forEach(p => p.classList.remove('active'));
  document.querySelector(`.diff-pill.${d}`).classList.add('active');
  pickWord();
  stopListening();
}

// ═══════════════════════════════════════════════════════════════
//  SPEECH RECOGNITION
// ═══════════════════════════════════════════════════════════════

// Desktop Safari's Web Speech API is broken — use Whisper instead
// iOS Safari supports Web Speech API fine, so only route desktop Safari to Whisper
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isSafari = !isIOS && /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

// ── Whisper loader (Safari only) ────────────────────────────────
async function initWhisper() {
  if (whisperReady || whisperLoading) return;
  whisperLoading = true;
  setFeedback('📥 Loading voice model for the first time… (about 30 seconds)');
  try {
    const { pipeline, env } = await import(
      'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'
    );
    env.allowLocalModels = false;
    whisperPipeline = await pipeline(
      'automatic-speech-recognition',
      'Xenova/whisper-tiny.en',
      {
        progress_callback: (p) => {
          if (p.status === 'downloading' && p.total) {
            const pct = Math.round((p.loaded / p.total) * 100);
            setFeedback(`📥 Loading voice model… ${pct}%`);
          }
        }
      }
    );
    whisperReady   = true;
    whisperLoading = false;
    setFeedback('✅ Voice model ready! Tap the mic and say a word.');
  } catch (err) {
    whisperLoading = false;
    setFeedback('❌ Could not load voice model. Check your internet and reload.');
  }
}

// ── Whisper recording (Safari) ──────────────────────────────────
async function startWhisperListening() {
  if (!whisperReady) {
    if (!whisperLoading) initWhisper();
    setFeedback('⏳ Voice model still loading — please wait a moment…');
    return;
  }
  if (!wordShown) {
    wordShown = true;
    renderBlanks(true);
    document.getElementById('wordLabel').textContent = 'Read this word!';
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioChunks  = [];
    abortRequested = false;
    mediaRecorder  = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      isListening = false;
      micBtn('idle');
      if (abortRequested) { abortRequested = false; return; }

      document.getElementById('micHint').textContent = 'Processing…';
      try {
        const blob        = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        const arrayBuffer = await blob.arrayBuffer();
        const audioCtx    = new AudioContext({ sampleRate: 16000 });
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const float32     = audioBuffer.getChannelData(0);

        const result     = await whisperPipeline(float32, { language: 'english', task: 'transcribe' });
        const transcript = result.text.trim().toLowerCase().replace(/[^a-z]/g, '');

        if (transcript) {
          document.getElementById('heardText').textContent = `I heard: "${transcript}"`;
          evaluateAnswer(transcript, [transcript]);
        } else {
          setFeedback("Couldn't hear that — try speaking a little louder!");
          document.getElementById('micHint').textContent = 'Tap mic, then say the word';
        }
      } catch (err) {
        setFeedback('Processing error — please try again.');
        document.getElementById('micHint').textContent = 'Tap mic, then say the word';
      }
    };

    isListening = true;
    micBtn('listening');
    document.getElementById('micHint').textContent = 'Listening… say the word!';
    mediaRecorder.start();
    safetyTimer = setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }, 4000);

  } catch (err) {
    setFeedback('🎙️ Microphone access denied — allow microphone access and try again.');
    micBtn('idle');
  }
}

function stopWhisperListening() {
  clearTimeout(safetyTimer);
  abortRequested = true;
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try { mediaRecorder.stop(); } catch (e) {}
  }
  mediaRecorder = null;
  isListening   = false;
  micBtn('idle');
  document.getElementById('micHint').textContent = 'Tap mic, then say the word';
}

// ── Unified toggle ──────────────────────────────────────────────
function toggleMic() {
  if (isListening) {
    isSafari ? stopWhisperListening() : stopListening();
  } else {
    isSafari ? startWhisperListening() : startListening();
  }
}

function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    setFeedback("Speech recognition isn't supported here. Try Chrome on desktop or Safari on iOS.");
    return;
  }
  if (!wordShown) {
    wordShown = true;
    renderBlanks(true);
    document.getElementById('wordLabel').textContent = 'Read this word!';
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous      = false;
  recognition.interimResults  = !isSafari;  // Safari is unreliable with interim results
  recognition.maxAlternatives = 3;
  recognition.lang            = 'en-US';

  let lastInterimTranscript = '';
  let lastInterimAlts      = [];
  let evaluationDone       = false;
  let gotAnyResult         = false;

  // Safari needs more time to return a result
  const SAFETY_MS      = isSafari ? 6000 : 4000;
  const INTERIM_GAP_MS = isSafari ? 3500 : 2500;

  recognition.onstart = () => {
    isListening = true;
    abortRequested        = false;
    lastInterimTranscript = '';
    lastInterimAlts       = [];
    evaluationDone        = false;
    gotAnyResult          = false;
    micBtn('listening');
    document.getElementById('micHint').textContent = 'Listening… say the word!';
    safetyTimer = setTimeout(() => stopListening(), SAFETY_MS);
  };

  recognition.onresult = (event) => {
    gotAnyResult = true;
    const topResult     = event.results[event.results.length - 1];
    const topTranscript = topResult[0].transcript.trim().toLowerCase();
    const isFinal       = topResult.isFinal;

    const alternatives = [];
    for (let a = 0; a < Math.min(topResult.length, 3); a++) {
      alternatives.push(topResult[a].transcript.trim().toLowerCase());
    }

    document.getElementById('heardText').textContent = `I heard: "${topTranscript}"`;
    renderBlanks(false, topTranscript.replace(/\s/g, ''));

    if (isFinal) {
      clearTimeout(safetyTimer);
      evaluationDone = true;
      evaluateAnswer(topTranscript.replace(/\s/g, ''), alternatives);
    } else {
      // Interim result — save as fallback and reset the safety timer
      lastInterimTranscript = topTranscript;
      lastInterimAlts       = alternatives;
      clearTimeout(safetyTimer);
      safetyTimer = setTimeout(() => stopListening(), INTERIM_GAP_MS);
    }
  };

  recognition.onerror = (e) => {
    clearTimeout(safetyTimer);
    stopListening();
    if (e.error === 'not-allowed') {
      setFeedback('🎙️ Microphone access denied. Check Safari → Settings → Microphone.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setFeedback(`Mic issue: ${e.error}. Try again!`);
    }
  };

  recognition.onend = () => {
    clearTimeout(safetyTimer);
    // Evaluate a saved interim result if recognition ended without a final event
    if (!evaluationDone && !abortRequested && lastInterimTranscript) {
      evaluationDone = true;
      evaluateAnswer(lastInterimTranscript.replace(/\s/g, ''), lastInterimAlts);
      return;
    }
    // Nothing heard at all on Safari — guide the user
    if (!evaluationDone && !abortRequested && !gotAnyResult && isSafari) {
      setFeedback("🦁 Couldn't hear anything. On Mac Safari, Siri must be on: System Settings → Siri & Spotlight → enable Ask Siri.");
    }
    abortRequested = false;
    isListening = false;
    micBtn('idle');
    document.getElementById('micHint').textContent = 'Tap mic, then say the word';
  };

  recognition.start();
}

function stopListening() {
  clearTimeout(safetyTimer);
  if (recognition) {
    abortRequested = true;
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    abortRequested = true;
    try { mediaRecorder.stop(); } catch(e) {}
    mediaRecorder = null;
  }
  isListening = false;
  micBtn('idle');
  document.getElementById('micHint').textContent = 'Tap mic, then say the word';
}

function micBtn(mode) {
  const btn = document.getElementById('micBtn');
  btn.className = 'mic-btn';
  if (mode === 'listening') btn.classList.add('listening');
  if (mode === 'correct')   btn.classList.add('correct-flash');
  if (mode === 'wrong')     btn.classList.add('wrong-flash');
  btn.textContent = mode === 'listening' ? '⏹' : '🎙️';
}

// ═══════════════════════════════════════════════════════════════
//  EVALUATION
// ═══════════════════════════════════════════════════════════════
// Extract the best 3-letter match from a transcript against the target.
// If speech recognition returns e.g. "smug" when target is "mug",
// check if any 3-letter substring equals the target.
function bestMatch(transcript, target) {
  if (!transcript) return transcript;
  const t = transcript.replace(/\s+/g, '').toLowerCase();
  if (t.length === 3) return t;
  if (target) {
    // scan all 3-char substrings for an exact match
    for (let i = 0; i <= t.length - 3; i++) {
      if (t.slice(i, i + 3) === target) return target;
    }
  }
  // fall back to last 3 chars (most likely the root word)
  return t.length > 3 ? t.slice(-3) : t;
}

function evaluateAnswer(heard, alternatives) {
  stopListening();
  const target = currentWord.toLowerCase();
  // Try to extract a clean 3-letter match from what was heard
  const cleanHeard = bestMatch(heard, target);
  const normalizedHeard = HOMOPHONE_MAP[cleanHeard] || cleanHeard;
  const correct = normalizedHeard === target;

  // Track per-letter accuracy
  const cleanAlts = alternatives.map(a => { const b = bestMatch(a, target); return HOMOPHONE_MAP[b] || b; });
  updateLetterAccuracy(target, normalizedHeard, cleanAlts);

  if (correct) {
    micBtn('correct');
    state.xp += xpForDiff();
    state.correctTotal++;
    correctSinceLastDragon++;
    const prizeJustUnlocked = checkPrizes();
    saveState();
    updateHUD();
    if (!prizeJustUnlocked) {
      setFeedback(`✅ "${currentWord.toUpperCase()}" — fantastic reading, ${state.name}!`);
    }
    if (state.apiKey) getAIFeedback(currentWord, true);
    renderBlanks(true);

    if (correctSinceLastDragon >= DRAGON_EVERY) {
      correctSinceLastDragon = 0;
      setTimeout(() => showDragon(), 1200);
    } else {
      setTimeout(() => pickWord(), 1400);
    }
  } else {
    micBtn('wrong');
    renderBlanks(false, heard);
    setFeedback(`Not quite! The word is "${currentWord.toUpperCase()}". Try again!`);
    if (state.apiKey) getAIFeedback(currentWord, false, heard);
    setTimeout(() => micBtn('idle'), 800);
  }
}

function xpForDiff() {
  return { easy: 1, medium: 2, hard: 3 }[currentDiff];
}

// ═══════════════════════════════════════════════════════════════
//  LETTER ACCURACY
// ═══════════════════════════════════════════════════════════════
function updateLetterAccuracy(target, topHeard, alternatives) {
  if (!state.letterPos) state.letterPos = {};
  for (let i = 0; i < target.length; i++) {
    const letter = target[i];
    // overall hits
    if (!state.letterHits[letter]) state.letterHits[letter] = { correct: 0, total: 0 };
    state.letterHits[letter].total++;
    const hit = alternatives.some(alt => alt[i] === letter);
    if (hit) state.letterHits[letter].correct++;

    // positional hits (key = letter + position index 0/1/2)
    const posKey = letter + i;
    if (!state.letterPos[posKey]) state.letterPos[posKey] = { correct: 0, total: 0 };
    state.letterPos[posKey].total++;
    if (hit) state.letterPos[posKey].correct++;
  }
  renderLetterGrid();
}

function buildLetterGrid() {
  const grid = document.getElementById('letterGrid');
  grid.innerHTML = '';
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(l => {
    const cell = document.createElement('div');
    cell.className = 'letter-cell';
    cell.id = `lc-${l}`;
    cell.innerHTML = `<span class="ltr">${l.toUpperCase()}</span><span class="pct">–</span>`;
    grid.appendChild(cell);
  });
  renderLetterGrid();
}

function renderLetterGrid() {
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(l => {
    const cell = document.getElementById(`lc-${l}`);
    if (!cell) return;
    const data = state.letterHits[l];
    if (!data || data.total === 0) { cell.className = 'letter-cell'; cell.querySelector('.pct').textContent = '–'; return; }
    const pct = Math.round((data.correct / data.total) * 100);
    cell.querySelector('.pct').textContent = `${pct}%`;
    cell.className = 'letter-cell ' + (pct >= 80 ? 'great' : pct >= 50 ? 'good' : 'poor');
  });
}

function toggleGrid() {
  const visible = document.getElementById('letterGrid').classList.toggle('visible');
  document.getElementById('resetBtn').style.display = visible ? 'block' : 'none';
}

//  FEEDBACK
// ═══════════════════════════════════════════════════════════════
function setFeedback(msg) {
  document.getElementById('feedbackBox').textContent = msg;
}

async function getAIFeedback(word, correct, heard) {
  if (!state.apiKey) return;
  try {
    const prompt = correct
      ? `The child "${state.name}" correctly read the CVC word "${word}". Give a very short (1 sentence), enthusiastic, age-appropriate encouragement. Mention the word.`
      : `The child "${state.name}" tried to read "${word}" but said "${heard || 'something else'}". Give a very short (1 sentence), gentle, encouraging tip to help them try again.`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 80,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) return;
    const data = await res.json();
    const text = data?.content?.[0]?.text?.trim();
    if (text) setFeedback((correct ? '🤖 ' : '🤖 ') + text);
  } catch(e) { /* silent fail */ }
}

// ═══════════════════════════════════════════════════════════════
//  PRIZES
// ═══════════════════════════════════════════════════════════════
function checkPrizes() {
  let prizeUnlocked = false;
  PRIZES.forEach((p, i) => {
    if (!state.prizesUnlocked.includes(i) && state.xp >= p.xpNeeded) {
      state.prizesUnlocked.push(i);
      setFeedback(`🎉 New prize unlocked: ${p.emoji} ${p.label}!`);
      prizeUnlocked = true;
    }
  });
  return prizeUnlocked;
}

function renderPrizes() {
  const grid = document.getElementById('prizeGrid');
  grid.innerHTML = '';
  PRIZES.forEach((p, i) => {
    const unlocked = state.prizesUnlocked.includes(i);
    const item = document.createElement('div');
    item.className = 'prize-item' + (unlocked ? '' : ' locked');
    item.innerHTML = `<div>${p.emoji}</div><div class="prize-label">${unlocked ? p.label : `${p.xpNeeded} XP`}</div>`;
    grid.appendChild(item);
  });
}

//  REPORT SCREEN

// Letters that appear at each CVC position across the word bank
function getPositionLetters() {
  const pos = { 0: new Set(), 1: new Set(), 2: new Set() };
  Object.values(WORDS).flat().forEach(w => {
    for (let i = 0; i < 3; i++) pos[i].add(w[i]);
  });
  return pos;
}

function chipClass(pct, hasSeen) {
  if (!hasSeen) return 'chip-unseen';
  if (pct >= 80) return 'chip-great';
  if (pct >= 70) return 'chip-good';
  return 'chip-poor';
}

function renderPositionGroup(containerId, letters) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!letters.size) { el.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:0.8rem">None yet</span>'; return; }
  [...letters].sort().forEach(letter => {
    const data = state.letterHits[letter];
    const hasSeen = data && data.total > 0;
    const pct = hasSeen ? Math.round((data.correct / data.total) * 100) : null;
    const cls = chipClass(pct, hasSeen);
    const chip = document.createElement('div');
    chip.className = `report-letter-chip ${cls}`;
    chip.innerHTML = `<span class="chip-letter">${letter.toUpperCase()}</span><span>${hasSeen ? pct + '%' : '–'}</span>`;
    el.appendChild(chip);
  });
}

async function getAITip(letter, pct, posLabels) {
  if (!state.apiKey) return null;
  const posText = posLabels.length ? `It mainly appears at the ${posLabels.join(' and ')} of words.` : '';
  const prompt = `A child learning to read CVC words is struggling with the letter "${letter.toUpperCase()}" (${pct}% accuracy). ${posText} Give one very short, friendly, practical tip for a parent or teacher to help the child practice this letter sound. One sentence only, fun and encouraging.`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 80,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data?.content?.[0]?.text?.trim() || null;
  } catch(e) { return null; }
}

async function showReport() {
  showScreen('reportScreen');

  const posLetters = getPositionLetters();
  const MIN_ATTEMPTS = 3; // need at least this many attempts to flag as struggling

  // subtitle
  const totalAttempts = Object.values(state.letterHits).reduce((s, d) => s + d.total, 0);
  const subtitle = document.getElementById('reportSubtitle');
  subtitle.textContent = totalAttempts === 0
    ? 'Read some words first to see your letter report!'
    : `Based on ${totalAttempts} letter attempts across all words`;

  // position groups
  renderPositionGroup('reportPosStart', posLetters[0]);
  renderPositionGroup('reportPosMid',   posLetters[1]);
  renderPositionGroup('reportPosEnd',   posLetters[2]);

  // needs work section
  const needsWorkEl    = document.getElementById('reportNeedsWork');
  const tipsContainer  = document.getElementById('reportTipsContainer');
  tipsContainer.innerHTML = '';

  // find struggling letters (< 70%, min 3 attempts)
  const struggling = [];
  Object.entries(state.letterHits).forEach(([letter, data]) => {
    if (data.total >= MIN_ATTEMPTS) {
      const pct = Math.round((data.correct / data.total) * 100);
      if (pct < 70) struggling.push({ letter, pct, total: data.total });
    }
  });
  struggling.sort((a, b) => a.pct - b.pct); // worst first

  if (struggling.length === 0) {
    needsWorkEl.style.display = 'none';
    if (totalAttempts > 0) {
      const msg = document.createElement('div');
      msg.className = 'report-empty';
      msg.textContent = '🌟 Great job! No letters need extra practice yet.';
      tipsContainer.appendChild(msg);
      needsWorkEl.style.display = 'block';
    }
    return;
  }

  needsWorkEl.style.display = 'block';

  // build a card per struggling letter, load AI tips async
  struggling.forEach(({ letter, pct, total }) => {
    // figure out which positions this letter appears in
    const posNames = [];
    if (posLetters[0].has(letter)) posNames.push('start');
    if (posLetters[1].has(letter)) posNames.push('middle');
    if (posLetters[2].has(letter)) posNames.push('end');

    const card = document.createElement('div');
    card.className = 'report-tip-card';
    card.innerHTML = `
      <div class="report-tip-header">
        <div class="report-tip-letter">${letter.toUpperCase()}</div>
        <div class="report-tip-meta">
          <strong>${pct}% accuracy</strong> · ${total} attempt${total !== 1 ? 's' : ''}<br>
          Position: ${posNames.length ? posNames.join(', ') : 'various'}
        </div>
      </div>
      <div class="report-tip-text" id="tip-${letter}">
        ${state.apiKey ? '<span class="report-tip-loading">Loading tip…</span>' : '💡 Try practicing words that start or end with <strong>' + letter.toUpperCase() + '</strong> out loud together.'}
      </div>`;
    tipsContainer.appendChild(card);

    // fetch AI tip async if key available
    if (state.apiKey) {
      getAITip(letter, pct, posNames).then(tip => {
        const tipEl = document.getElementById(`tip-${letter}`);
        if (tipEl) tipEl.innerHTML = tip ? `💡 ${tip}` : `💡 Practice words with <strong>${letter.toUpperCase()}</strong> — say them slowly and clearly!`;
      });
    }
  });
}

const particles = [];

function startDragonAnimation() {
  const canvas = document.getElementById('dragonCanvas');
  const ctx    = canvas.getContext('2d');
  dragonT = 0;
  particles.length = 0;

  function frame() {
    dragonT += 0.04;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background glow
    const grd = ctx.createRadialGradient(160, 140, 20, 160, 140, 160);
    grd.addColorStop(0, 'rgba(255,100,0,0.12)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const bob = Math.sin(dragonT * 1.5) * 6;

    drawDragon(ctx, 160, 140 + bob, dragonT);
    updateParticles(ctx);

    // Spawn fire particles
    if (Math.random() < 0.35) {
      particles.push({
        x: 260, y: 145 + bob + (Math.random() - 0.5) * 12,
        vx: 2 + Math.random() * 3, vy: (Math.random() - 0.5) * 1.5,
        life: 1, r: 4 + Math.random() * 6,
        hue: 10 + Math.random() * 40
      });
    }

    dragonRAF = requestAnimationFrame(frame);
  }
  dragonRAF = requestAnimationFrame(frame);
}

function stopDragonAnimation() {
  if (dragonRAF) cancelAnimationFrame(dragonRAF);
  dragonRAF = null;
}

function updateParticles(ctx) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.life -= 0.025; p.r *= 0.98;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = `hsl(${p.hue},100%,55%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDragon(ctx, cx, cy, t) {
  ctx.save();
  ctx.translate(cx, cy);

  // TAIL — wavy
  ctx.strokeStyle = '#2ecc40'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-10, 10);
  ctx.bezierCurveTo(
    -50 + Math.sin(t) * 10, 40,
    -80 + Math.cos(t * 0.7) * 8, 10,
    -90 + Math.sin(t * 1.2) * 12, -10
  );
  ctx.stroke();
  ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 6;
  ctx.stroke();

  // BODY
  ctx.fillStyle = '#27ae60';
  ctx.beginPath(); ctx.ellipse(0, 10, 50, 32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2ecc40';
  ctx.beginPath(); ctx.ellipse(0, 10, 46, 28, 0, 0, Math.PI * 2); ctx.fill();

  // BELLY
  ctx.fillStyle = '#a8e6cf';
  ctx.beginPath(); ctx.ellipse(6, 16, 28, 18, 0.1, 0, Math.PI * 2); ctx.fill();

  // WING left
  const wingL = Math.sin(t * 2.5) * 18;
  ctx.fillStyle = 'rgba(46,204,64,0.7)';
  ctx.beginPath();
  ctx.moveTo(-10, -8);
  ctx.bezierCurveTo(-60, -40 - wingL, -80, -20 - wingL, -50, 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1a7a28'; ctx.lineWidth = 1.5; ctx.stroke();

  // WING right
  const wingR = Math.sin(t * 2.5 + 0.4) * 18;
  ctx.fillStyle = 'rgba(46,204,64,0.6)';
  ctx.beginPath();
  ctx.moveTo(10, -8);
  ctx.bezierCurveTo(60, -40 - wingR, 80, -20 - wingR, 50, 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1a7a28'; ctx.lineWidth = 1.5; ctx.stroke();

  // HEAD
  ctx.fillStyle = '#27ae60';
  ctx.beginPath(); ctx.ellipse(40, -10, 28, 22, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2ecc40';
  ctx.beginPath(); ctx.ellipse(40, -10, 25, 19, 0.3, 0, Math.PI * 2); ctx.fill();

  // SNOUT
  ctx.fillStyle = '#27ae60';
  ctx.beginPath(); ctx.ellipse(64, 0, 14, 9, 0.2, 0, Math.PI * 2); ctx.fill();

  // NOSTRIL
  ctx.fillStyle = '#1a5c2a';
  ctx.beginPath(); ctx.arc(68, -1, 2.5, 0, Math.PI * 2); ctx.fill();

  // EYE — glowing slit
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.ellipse(50, -18, 9, 7, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.save(); ctx.translate(50, -18); ctx.rotate(0.2);
  ctx.beginPath(); ctx.ellipse(0, 0, 2.5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // glow
  ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
  ctx.fillStyle = 'rgba(255,215,0,0.4)';
  ctx.beginPath(); ctx.ellipse(50, -18, 10, 8, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // HORNS
  ctx.fillStyle = '#f39c12';
  for (const [hx, hy, ang] of [[38, -30, -0.3], [46, -30, 0.1]]) {
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.lineTo(0, -14); ctx.closePath();
    ctx.fill(); ctx.restore();
  }

  // SPINES on back
  ctx.fillStyle = '#f39c12';
  for (let i = 0; i < 4; i++) {
    const sx = -20 + i * 14, sy = -18 + Math.sin(t + i) * 3;
    ctx.beginPath(); ctx.moveTo(sx - 4, -4); ctx.lineTo(sx + 4, -4); ctx.lineTo(sx, sy - 10); ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  STAR FIELD BACKGROUND
// ═══════════════════════════════════════════════════════════════
(function() {
  const canvas = document.getElementById('starField');
  const ctx = canvas.getContext('2d');
  const stars = [];
  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.5 + 0.3,
      alpha: Math.random(), speed: Math.random() * 0.008 + 0.002
    });
  }
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.speed * (Math.random() > 0.5 ? 1 : -1);
      s.alpha = Math.max(0.05, Math.min(0.9, s.alpha));
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

// ═══════════════════════════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════════════════════════
function resetProgress() {
  if (!confirm(`Reset all progress for ${state.name || 'this player'}? This can't be undone.`)) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
loadState();

if (state.name) {
  // Returning user — skip name screen, go straight to game
  initGame();
} else {
  showScreen('nameScreen');
}
</script>
